<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="512" viewBox="0 0 1120 512" role="img" aria-labelledby="t d"><title id="t">COLLECT. Run source adapters independently and record source errors.; QUALIFY. Infer geography, industries, contacts and weighted buying signals.; DEDUPLICATE. Group by normalized domain/path or title; keep the higher score.; PUBLISH &amp; REVIEW. Write public/leads.json for filtering and manual follow-up.</title><desc id="d">COLLECT. Run source adapters independently and record source errors.; QUALIFY. Infer geography, industries, contacts and weighted buying signals.; DEDUPLICATE. Group by normalized domain/path or title; keep the higher score.; PUBLISH &amp; REVIEW. Write public/leads.json for filtering and manual follow-up. Conceptual radar artwork, not live prospects or measured business outcomes.</desc><style>@keyframes sweep{to{transform:rotate(360deg)}}.sweep{animation:sweep 14s linear infinite;transform-origin:0 0}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.sweep,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="235" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M22 3a19 19 0 1 0 19 19M22 10a12 12 0 1 0 12 12M22 22L40 4M22 16v6h6" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >COLLECT</text><text x="48" y="121" font-family="Ba