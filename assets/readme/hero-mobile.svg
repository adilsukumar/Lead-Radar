<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1115" viewBox="0 0 640 1115" role="img" aria-labelledby="t d"><title id="t">Lead Radar. Spot a signal. Public-source discovery, rules-based qualification and a static outreach dashboard. Concept radar illustration, not live lead data.</title><desc id="d">Lead Radar. Spot a signal. Public-source discovery, rules-based qualification and a static outreach dashboard. Concept radar illustration, not live lead data. Conceptual radar artwork, not live prospects or measured business outcomes.</desc><style>@keyframes sweep{to{transform:rotate(360deg)}}.sweep{animation:sweep 14s linear infinite;transform-origin:0 0}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.sweep,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="52" font-family="Bahnschrift, Arial, sans-serif" font-size="21" fill="#BCFCF6" font-weight="600" >PUBLIC SIGNALS / SOFTWARE OPPORTUNITIES</text><text x="24" y="212" font-family="Bahnschrift, Arial, sans-serif" font-size="162" fill="#F8F8F3" font-weight="700" letter-spacing="-6">LEAD</text><text x="24" y="365" font-family="Bahnschrift, Arial, sans-serif" font-size="158" fill="#FF4081" font-weight="700" letter-spacing="-6">RADAR</text><text x="32" y="443" font-family="Bahnschrift, Arial, sans-serif" font-size="45" fill="#BCFCF6" font-weight="600" >Spot a signal.</text><text x="32" y="505" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >A daily starting point for finding</text><text x="32" y="539" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >teams that might need your software</text><text x="32" y="573" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >skills.</text><g transform="translate(320 800) scale(1)"><circle r="52" fill="none" stroke="#343044" stroke-width="2"/><circle r="104" fill="none" stroke="#343044" stroke-width="2"/><circle r="156" fill="none" stroke="#343044" stroke-width="2"/><path d="M-175 0H175M0 -175V175" fill="none" stroke="#343044" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="sweep"><path d="M0 0L0 -155A155 155 0 0 1 134 -77Z" fill="#FF4081" opacity=".13"/><path d="M0 0V-155" fill="none" stroke="#FF4081" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="-89" cy="-48" r="6" fill="#F3D962" class="pulse" style="animation-delay:-0s"/><circle cx="74" cy="-91" r="6" fill="#BCFCF6" class="pulse" style="animation-delay:-1s"/><circle cx="112" cy="49" r="6" fill="#F3D962" class="pulse" style="animation-delay:-2s"/><circle cx="-37" cy="109" r="6" fill="#BCFCF6" class="pulse" style="animation-delay:-3s"/><circle cx="25" cy="-27" r="6" fill="#F3D962" class="pulse" style="animation-delay:-4s"/><circle r="5" fill="#F8F8F3"/><text x="0" y="205" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#A783F7" font-weight="600" text-anchor="middle">FIND / FILTER / FOLLOW UP</text></g><text x="32" y="1074" font-family="Bahnschrift, Arial, sans-serif" font-size="21" fill="#F3D962" font-weight="600" >NODE.JS / STATIC DASHBOARD / DAILY REFRESH</text></svg>