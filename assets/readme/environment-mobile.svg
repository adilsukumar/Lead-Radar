<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-labelledby="t d"><title id="t">Node 18 or later. No npm install required by the current dependency-free scraper.</title><desc id="d">Node 18 or later. No npm install required by the current dependency-free scraper. Conceptual radar artwork, not live prospects or measured business outcomes.</desc><style>@keyframes sweep{to{transform:rotate(360deg)}}.sweep{animation:sweep 14s linear infinite;transform-origin:0 0}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.sweep,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="235" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 38) scale(1.0)"><path d="M4 7h36v31H4zM11 16l7 7-7 7M25 30h8" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="112" y="74" font-family="Bahnschrift, Arial, sans-serif" font-size="30" fill="#F8F8F3" font-weight="600" >NO INSTALL STEP</text><text x="46" y="138" font-family="Bahnschrift, Arial, sans-serif" font-size="30" fill="#F3D962" font-weight="600" >Node 18+ / built-in fetch</text><text x="46" y="194" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Refresh the JSON, then serve the static</text><text x="46" y="228" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >dashboard.</text></svg>