<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="t d"><title id="t">Find the signal. Make it personal. Research the business, understand the need and start a useful conversation.</title><desc id="d">Find the signal. Make it personal. Research the business, understand the need and start a useful conversation. Conceptual radar artwork, not live prospects or measured business outcomes.</desc><style>@keyframes sweep{to{transform:rotate(360deg)}}.sweep{animation:sweep 14s linear infinite;transform-origin:0 0}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.sweep,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="53" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="600" >LEAD RADAR / ADIL SUKUMAR</text><text x="30" y="159" font-family="Bahnschrift, Arial, sans-serif" font-size="58" fill="#F8F8F3" font-weight="700" >Find the signal.</text><text x="30" y="240" font-family="Bahnschrift, Arial, sans-serif" font-size="55" fill="#BCFCF6" font-weight="700" >Make it personal.</text><text x="32" y="316" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >Research the business. Understand the</text><text x="32" y="350" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >need. Start a useful conversation.</text><g transform="translate(440 520) scale(0.66)"><circle r="52" fill="none" stroke="#343044" stroke-width="2"/><circle r="104" fill="none" stroke="#343044" stroke-width="2"/><circle r="156" fill="none" stroke="#343044" stroke-width="2"/><path d="M-175 0H175M0 -175V175" fill="none" stroke="#343044" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="sweep"><path d="M0 0L0 -155A155 155 0 0 1 134 -77Z" fill="#FF4081" opacity=".13"/><path d="M0 0V-155" fill="none" stroke="#FF4081" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="-89" cy="-48" r="6" fill="#F3D962" class="pulse" style="animation-delay:-0s"/><circle cx="74" cy="-91" r="6" fill="#BCFCF6" class="pulse" style="animation-delay:-1s"/><circle cx="112" cy="49" r="6" fill="#F3D962" class="pulse" style="animation-delay:-2s"/><circle cx="-37" cy="109" r="6" fill="#BCFCF6" class="pulse" style="animation-delay:-3s"/><circle cx="25" cy="-27" r="6" fill="#F3D962" class="pulse" style="animation-delay:-4s"/><circle r="5" fill="#F8F8F3"/><text x="0" y="205" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#A783F7" font-weight="600" text-anchor="middle">FIND / FILTER / FOLLOW UP</text></g><text x="32" y="742" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >A shortlist is where the real work begins.</text></svg>