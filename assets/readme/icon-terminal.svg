<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="t d"><title id="t">terminal</title><desc id="d">terminal Conceptual radar artwork, not live prospects or measured business outcomes.</desc><style>@keyframes sweep{to{transform:rotate(360deg)}}.sweep{animation:sweep 14s linear infinite;transform-origin:0 0}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.sweep,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><g transform="translate(2 2) scale(0.9545454545454546)"><path d="M4 7h36v31H4zM11 16l7 7-7 7M25 30h8" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>